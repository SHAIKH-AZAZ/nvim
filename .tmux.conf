# ─────────────────────────────────────────────
# 🚀 CORE + TERMINAL
# ─────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',xterm-256color:RGB'
set -g mouse on
set -g focus-events on
set -g escape-time 0
set -g history-limit 100000
setw -g mode-keys vi

# Disable renaming
set -g automatic-rename off
set -g allow-rename off

# Clipboard
set -g set-clipboard on

# ─────────────────────────────────────────────
# 🔢 INDEXING
# ─────────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ─────────────────────────────────────────────
# ⌨️ PREFIX
# ─────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind r source-file ~/.tmux.conf \; display-message "Reloaded"

# ─────────────────────────────────────────────
# 🔌 TPM + PLUGINS
# ─────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'

# Theme
set -g @plugin 'catppuccin/tmux#v2.3.0'

# Your original plugins
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-net-speed'

# Extra useful ones
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# ─────────────────────────────────────────────
# 🎨 CATPPUCCIN
# ─────────────────────────────────────────────
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_flags "icon"
set -g @catppuccin_status_fill "icon"

set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_current_text "#W"

# ─────────────────────────────────────────────
# 📊 STATUS BAR (YOUR STYLE + CLEANED)
# ─────────────────────────────────────────────
set -g status on
set -g status-position top
set -g status-justify centre

set -g status-left ""
set -g status-left-length 100
set -g status-right-length 150

# Catppuccin modules (your original setup)
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_battery}"
set -agF status-right "#{E:@catppuccin_status_session}"
set -agF status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_date_time}"
set -agF status-right "#{E:@catppuccin_status_netspeed}"
set -agF status-right "#{E:@catppuccin_status_ram}"

# ─────────────────────────────────────────────
# ⚡ WINDOW / SESSION
# ─────────────────────────────────────────────
bind c new-window -c "#{pane_current_path}"

bind -n C-Left previous-window
bind -n C-Right next-window

bind s list-sessions
bind S command-prompt -p "New session:" "new-session -A -s '%%'"
bind R command-prompt -I "#S" "rename-session '%%'"
bind K confirm-before -p "Kill session?" kill-session
bind Tab choose-session

# ─────────────────────────────────────────────
# 🪟 PANE SPLITS
# ─────────────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind M-| split-window -h -p 30 -c "#{pane_current_path}"
bind M-- split-window -v -p 30 -c "#{pane_current_path}"

# ─────────────────────────────────────────────
# 🧭 NAVIGATION (VIM STYLE)
# ─────────────────────────────────────────────
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

bind -n M-Left  select-pane -L
bind -n M-Down  select-pane -D
bind -n M-Up    select-pane -U
bind -n M-Right select-pane -R

# ─────────────────────────────────────────────
# 📏 RESIZE
# ─────────────────────────────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ─────────────────────────────────────────────
# 📋 COPY MODE (ENHANCED)
# ─────────────────────────────────────────────
bind Enter copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ─────────────────────────────────────────────
# 🎯 POPUPS (NEW FEATURE)
# ─────────────────────────────────────────────
bind -n M-t display-popup -E -w 80% -h 80%
bind -n M-g display-popup -E -w 95% -h 95% "lazygit"
bind -n M-h display-popup -E -w 80% -h 80% "htop"

# ─────────────────────────────────────────────
# 💾 SESSION PERSISTENCE
# ─────────────────────────────────────────────
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# ─────────────────────────────────────────────
# 🎨 UI TWEAKS
# ─────────────────────────────────────────────
set -g pane-border-style 'fg=#313244'
set -g pane-active-border-style 'fg=#89b4fa'

# ─────────────────────────────────────────────
# 🚀 TPM INIT (LAST)
# ─────────────────────────────────────────────
run '~/.tmux/plugins/tpm/tpm'
