# ~/.tmux.conf

# ─────────────────────────────────────────────
# PREFIX
# ─────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Reloaded"

# ─────────────────────────────────────────────
# GENERAL
# ─────────────────────────────────────────────
set -g mouse on
set -g default-terminal "tmux-256color"
setw -g mode-keys vi
set -g history-limit 100000
# set-option -g allow-rename off
set -g automatic-rename off
set -g allow-rename off

# ─────────────────────────────────────────────
# TPM (Plugin Manager)
# ─────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-net-speed'
set -g @plugin 'tmux-plugins/tmux-sensible'

# ─────────────────────────────────────────────
# CATPPUCCIN
# ─────────────────────────────────────────────
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_flags "icon"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_current_text "#W"

run '~/.tmux/plugins/tpm/tpm'

# ─────────────────────────────────────────────
# STATUS BAR
# ─────────────────────────────────────────────
set -g status on
set -g status-position top
set -g status-justify centre

set -g status-left-length 100
set -g status-right-length 150

# Keep left empty so windows stay centered
set -g status-left ""

# Build right side with Catppuccin modules
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_battery}"
set -agF status-right "#{E:@catppuccin_status_session}"
set -agF status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_date_time}"

# Optional: if you want netspeed too, uncomment this line
set -agF status-right "#{E:@catppuccin_status_netspeed}"

# Optional: if Catppuccin RAM module is available in your setup, uncomment
set -agF status-right "#{E:@catppuccin_status_ram}"

# ─────────────────────────────────────────────
# FAST WINDOW MANAGEMENT
# ─────────────────────────────────────────────
bind c new-window
bind -n C-Left previous-window
bind -n C-Right next-window

bind s list-sessions
bind S command-prompt -p "New session name:" "new-session -s '%%'"
bind R command-prompt -I "#S" "rename-session '%%'"
bind K confirm-before -p "Kill session? (y/n)" "kill-session"
bind Tab choose-session

# ─────────────────────────────────────────────
# PANE SPLITS (Preserve Working Directory)
# ─────────────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}" \; select-pane -R
bind - split-window -v -c "#{pane_current_path}" \; select-pane -D

bind M-| split-window -h -p 30 -c "#{pane_current_path}" \; select-pane -R
bind M-- split-window -v -p 30 -c "#{pane_current_path}" \; select-pane -D

# ─────────────────────────────────────────────
# NAVIGATION (Vim-style)
# ─────────────────────────────────────────────
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

bind -n M-Left  select-pane -L
bind -n M-Down  select-pane -D
bind -n M-Up    select-pane -U
bind -n M-Right select-pane -R

# ─────────────────────────────────────────────
# RESIZE PANES
# ─────────────────────────────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ─────────────────────────────────────────────
# PANE UTILITIES
# ─────────────────────────────────────────────
bind q display-panes
bind z resize-pane -Z
bind ! break-pane
bind . command-prompt -p "join from:" "join-pane -s '%%'"
bind x confirm-before -p "Kill pane? (y/n)" "kill-pane"

# ─────────────────────────────────────────────
# LAYOUTS
# ─────────────────────────────────────────────
bind Space next-layout
bind b select-layout tiled
bind = select-layout even-horizontal
bind m select-layout main-vertical
bind M select-layout main-horizontal

# Coding layout
bind l select-layout tiled

# ─────────────────────────────────────────────
# WORKSPACES
# ─────────────────────────────────────────────
bind 1 new-window -n "dev"
bind 2 new-window -n "logs" "htop"
bind 3 new-window -n "ssh"
bind 4 new-window -n "git" "lazygit"
bind 5 new-window -n "repl"